name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # No install step: the engine and its tests use only Node built-ins.
      # Electron is a devDependency of the desktop shell, not of the tests.
      - name: Check every file parses
        run: |
          for file in electron/*.js scripts/*.js src/core/*.js src/core/*/*.js src/models/*.js src/ui/*.js test/*/*.js test/*/*/*.js; do
            node --check "$file"
          done

      - name: Verify the pinned Tor checksums still match the release manifest
        run: node scripts/check-tor-pins.js

      - name: Run tests
        run: npm test

  android:
    # The Android client: the protocol core's JVM tests, then a full debug
    # build of the app. Runs alongside the desktop suites, never instead of them.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # A checkout made on Windows may not carry the executable bit.
      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Protocol core tests
        run: ./gradlew --no-daemon :core:test

      - name: Build the app
        run: ./gradlew --no-daemon :app:assembleDebug
